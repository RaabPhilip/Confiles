[bar.default]
center = [ "workspaces" ]
end = [ "media", "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery" ]
margin_edge = 5
margin_ends = 5
margin_opposite_edge = 5
panel_overlap = 0
radius = 10
start = [ "clock", "spacer_left", "cpu", "ram" ]
widget_spacing = 8

[battery]
warning_threshold = 20

[calendar]
enabled = true

    [calendar.account.pipo]
    color = "primary"
    name = "Google"
    type = "google"

[control_center.calendar]
show_week_numbers = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "clipboard"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "audio"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[keybinds]
cancel = [ "Escape" ]
down = [ "Down" ]
left = [ "Left" ]
right = [ "Right" ]
up = [ "Up" ]
validate = [ "Return" ]

[location]
auto_locate = true

[lockscreen]
fingerprint = false
monitors = [ "eDP-1" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@Unknown-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DVI-I-2",
    "lockscreen-login-box@DVI-I-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DVI-I-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DVI-I-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DVI-I-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

