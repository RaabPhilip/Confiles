[plugins]
enabled = [ "noctalia/bongocat" ]

[shell]
clipboard_history_max_entries = 200
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

    [shell.animation]
    speed = 0.5000000074505806

    [shell.launcher]
    categories = false

        [shell.launcher.providers.calculator]
        prefix = "="

        [shell.launcher.providers.emoji]
        global = false
        prefix = ": "

        [shell.launcher.providers.wallpaper]
        global = true

    [shell.panel]
    launcher_categories = false
    launcher_session_search = true
    session_placement = "floating"

    [shell.screenshot]
    directory = "/home/pipo/Pictures/screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "hyprland" ]
    community_ids = [
        "claude-code",
        "spotifast",
        "zen-browser",
        "discord",
        "libreoffice",
        "micro",
        "obsidian",
        "zed",
        "fastfetch",
        "superfile"
    ]

[wallpaper]
directory = "/home/pipo/Pictures/wallpapers"
transition_duration = 1000
transition_on_startup = true

    [wallpaper.automation]
    recursive = false

    [wallpaper.default]
    path = "/home/pipo/Pictures/wallpapers/explorer_green_day.jpg"

    [wallpaper.last]
    path = "/home/pipo/Pictures/wallpapers/explorer_green_day.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/pipo/Pictures/wallpapers/explorer_green_day.jpg"

[widget.clock]
format = "{:%d.%m.%Y - %H:%M}"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.spacer_left]
type = "spacer"
