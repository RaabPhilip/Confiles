##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
$monitor1 = eDP-1
$monitor2 = desc:Microstep MSI MP273Q E2 PB6H454A00496
$monitor3 = desc:Microstep MSI MP273Q E2 PB6H454A00249
$beamer = HDMI-A-1

workspace = 1,monitor:$monitor1, default:true, on-created-empty:alacritty
workspace = 2,monitor:$monitor2, default:true
workspace = 3,monitor:$monitor3, default:true, on-created-empty:zen-browser

workspace = 4,monitor:$beamer,default:true

workspace = name:music, on-created-empty:spotify

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
